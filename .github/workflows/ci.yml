name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: for f in lab/*.sh; do bash -n "$f"; done
      - name: ShellCheck
        run: shellcheck -S warning lab/*.sh

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
